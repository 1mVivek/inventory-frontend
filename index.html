<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inventory App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
  font-family: system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #020617, #020617);
  color: #e5e7eb;
  padding: 30px;
}

h1 {
  color: #a5b4fc;
}

input, button {
  padding: 12px;
  margin: 6px 0;
  width: 100%;
  max-width: 420px;
  border-radius: 8px;
  border: none;
}

input {
  background: #020617;
  border: 1px solid #334155;
  color: white;
}

button {
  background: #6366f1;
  font-weight: 600;
}

button:hover {
  background: #4f46e5;
}

pre {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 8px;
}
  </style>
</head>

<body>

<h1>📦 Inventory Management</h1>

<!-- LOGIN -->
<h2>Login</h2>
<input id="email" type="email" placeholder="Email" />
<input id="password" type="password" placeholder="Password" />
<button onclick="login()">Login</button>

<!-- SIGNUP -->
<h2>Signup</h2>
<input id="s_email" type="email" placeholder="Email" />
<input id="s_password" type="password" placeholder="Password" />
<button onclick="signup()">Signup</button>

<hr />

<!-- INVENTORY -->
<h2>Add Item</h2>
<input id="itemName" placeholder="Item name" />
<input id="quantity" type="number" placeholder="Quantity" />
<button onclick="addItem()">Add Item</button>

<h2>My Items</h2>
<button onclick="getItems()">Load Items</button>
<pre id="items"></pre>

<button onclick="logout()">Logout</button>

<p id="status"></p>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // 🔥 Firebase config (SAFE to expose)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const BACKEND_URL = "https://inventory-backend-wikc.onrender.com";

  // LOGIN
  window.login = async () => {
    try {
      const email = emailEl.value;
      const password = passwordEl.value;
      const userCred = await signInWithEmailAndPassword(auth, email, password);
      const token = await userCred.user.getIdToken();
      localStorage.setItem("token", token);
      status.innerText = "✅ Logged in";
    } catch (e) {
      status.innerText = e.message;
    }
  };

  // SIGNUP
  window.signup = async () => {
    try {
      await createUserWithEmailAndPassword(
        auth,
        s_email.value,
        s_password.value
      );
      alert("✅ Signup successful. Login now.");
    } catch (e) {
      alert(e.message);
    }
  };

  // ADD ITEM
  window.addItem = async () => {
    const token = localStorage.getItem("token");
    if (!token) return alert("Login first");

    const res = await fetch(`${BACKEND_URL}/items`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        name: itemName.value,
        quantity: Number(quantity.value)
      })
    });

    const data = await res.json();
    status.innerText = JSON.stringify(data);
  };

  // GET ITEMS
  window.getItems = async () => {
    const token = localStorage.getItem("token");
    if (!token) return alert("Login first");

    const res = await fetch(`${BACKEND_URL}/items`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const data = await res.json();
    items.innerText = JSON.stringify(data, null, 2);
  };

  // LOGOUT
  window.logout = async () => {
    await signOut(auth);
    localStorage.removeItem("token");
    status.innerText = "👋 Logged out";
  };

  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const status = document.getElementById("status");
</script>

</body>
</html>
